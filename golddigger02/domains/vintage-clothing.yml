name: vintage-clothing
label: Vêtements de style vintage

# Domaine où le signal « modèle caché » est le plus rentable : le vendeur écrit
# « veste en jean bleue » et la référence qui vaut dix fois le prix demandé est
# sur l'étiquette, mentionnée en fin de description — ou seulement visible en photo.
categories: [vetements, chaussures, accessoires_bagagerie]

queries:
  - veste vintage annees 70
  - blouson cuir vintage
  - jean vintage annees 80
  - veste militaire vintage homme
  - manteau laine vintage
  - chemise vintage homme
  - workwear francais ancien
  - veste moleskine ancienne
  - pull laine vintage
  - trench vintage
  - bombers vintage
  - parka vintage

brands:
  - Levi's
  - Lee
  - Wrangler
  - Schott
  - Perfecto
  - Barbour
  - Belstaff
  - Baracuta
  - Harrington
  - Filson
  - Carhartt
  - Dickies
  - Adolphe Lafont
  - Le Mont Saint Michel
  - Vetra
  - Lacoste
  - Burberry
  - Aquascutum
  - Alpha Industries
  - Avirex
  - Redskins
  - Chevignon
  - Woolrich
  - Patagonia
  - The North Face
  - Ralph Lauren
  - Saint James

models:
  - {pattern: "big\\s*e\\b", name: "Levi's Big E", tier: "grail"}
  - {pattern: "redline|selvedge|selvage", name: "selvedge", tier: "high"}
  - {pattern: "50[0-9]\\s*xx|501\\s*xx", name: "Levi's 501XX", tier: "grail"}
  - {pattern: "\\b50[0-9]\\b", name: "Levi's 50x"}
  - {pattern: "\\b101\\b|lee\\s*storm", name: "Lee 101"}
  - {pattern: "perfecto|schott\\s*618|schott\\s*641", name: "Schott Perfecto", tier: "high"}
  - {pattern: "g-?9|baracuta", name: "Baracuta G9", tier: "high"}
  - {pattern: "bedale|beaufort|border|international", name: "Barbour modèle", tier: "high"}
  - {pattern: "trialmaster|roadmaster", name: "Belstaff Trialmaster", tier: "grail"}
  - {pattern: "m-?65|n-?[123]b|b-?15|a-?2\\b", name: "surplus US"}
  - {pattern: "mackinaw|cruiser", name: "Filson Cruiser", tier: "high"}
  - {pattern: "moleskine|bleu\\s*de\\s*travail", name: "workwear français"}
  - {pattern: "made\\s*in\\s*(usa|france|england|scotland)", name: "fabrication origine"}

