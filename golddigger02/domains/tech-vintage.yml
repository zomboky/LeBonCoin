models:
  - {pattern: "apple\\s*(i|1|lisa)\\b", name: "Apple I/Lisa", tier: "grail"}
  - {pattern: "apple\\s*(ii|2)(e|c|gs)?", name: "Apple II", tier: "high"}
  - {pattern: "macintosh\\s*(128|512|plus|se|classic)", name: "Macintosh early", tier: "high"}
  - {pattern: "next\\s*(cube|station)", name: "NeXT", tier: "grail"}
  - {pattern: "amiga\\s*(500|600|1200|2000|3000|4000)", name: "Amiga"}
  - {pattern: "atari\\s*(st|ste|800|2600|falcon)", name: "Atari"}
  - {pattern: "commodore\\s*(64|128|pet|vic)", name: "Commodore"}
  - {pattern: "zx\\s*(80|81|spectrum)", name: "Sinclair ZX"}
  - {pattern: "hp[- ]?(41c?[vx]?|48g?x?|35|65|97)", name: "HP calculatrice", tier: "high"}
  - {pattern: "sgi|indigo|octane|o2\\b", name: "Silicon Graphics"}
  - {pattern: "micral\\s*[a-z0-9]*", name: "Micral", tier: "grail"}
  - {pattern: "tektronix\\s*\\d{3,4}", name: "Tektronix"}
  - {pattern: "nixie", name: "tubes Nixie", tier: "high"}
  - {pattern: "minitel\\s*\\d?", name: "Minitel"}

