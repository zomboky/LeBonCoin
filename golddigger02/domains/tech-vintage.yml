name: tech-vintage
label: Objets technologiques anciens & high-tech rare

categories: [informatique, image_son, collection, consoles_jeux_video]

queries:
  - ordinateur vintage annees 80
  - micro ordinateur ancien
  - apple macintosh vintage
  - commodore amiga atari
  - minitel telematique
  - calculatrice hp vintage
  - oscilloscope tektronix
